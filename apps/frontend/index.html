<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case Intelligence</title>
    <script>
      // Dark-mode-first: honor an explicit saved choice, otherwise fall back to
      // system preference only when it explicitly prefers light. Applied before
      // paint to avoid a flash of the wrong theme.
      (function () {
        try {
          const stored = localStorage.getItem("theme");
          const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          const dark = stored ? stored === "dark" : !prefersLight;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
