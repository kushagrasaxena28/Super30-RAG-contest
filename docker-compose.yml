name: case-intelligence-rag

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: casedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # exposed for local debugging (psql, prisma migrate dev)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d casedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333" # exposed for manual debugging (curl the collections API)

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379" # exposed for local dev iteration (running api/worker with bun outside Docker)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: runs prisma migrate deploy + ensures the Qdrant collection
  # exists, then exits. api/worker both wait on this instead of racing each
  # other to run migrations (see plan/01-foundation.md).
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["bun", "run", "migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/casedb
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["bun", "run", "start"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/casedb
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    volumes:
      - ./docs/docs_for_test:/data/docs/docs_for_test:ro
      - ./docs/transcriptions_for_test:/data/docs/transcriptions_for_test:ro
      - uploads_data:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["bun", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/casedb
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
    volumes:
      - ./docs/docs_for_test:/data/docs/docs_for_test:ro
      - ./docs/transcriptions_for_test:/data/docs/transcriptions_for_test:ro
      - uploads_data:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: 1 # bump for more ingestion throughput; worker is stateless

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Browser-side JS reaches the api container through the host's
        # published port, not the internal docker network - so this stays
        # localhost even though every other service uses its container name.
        VITE_API_URL: http://localhost:3001
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  uploads_data:
